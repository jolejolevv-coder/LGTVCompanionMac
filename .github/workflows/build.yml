name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    # Creating the release on a tag needs write access to the repository
    # contents; the default token is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Swift 6 language mode and `isolated deinit` need Swift 6.2 or newer
      # (Xcode 26). Pick the newest Xcode 26 on the runner.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Test
        run: swift test

      - name: Build
        run: swift build -c release

      - name: Package app bundle + DMG
        run: ./scripts/build-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LGTVCompanion-dmg
          path: build/*.dmg

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
